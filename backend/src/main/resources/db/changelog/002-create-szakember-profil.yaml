databaseChangeLog:
  - changeSet:
      id: 002-create-szakember-profil
      author: szaki
      changes:
        - createTable:
            tableName: szakember_profil
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: bemutatkozas
                  type: text
              - column:
                  name: tapasztalat_ev
                  type: int
              - column:
                  name: min_ar
                  type: int
              - column:
                  name: max_ar
                  type: int
              - column:
                  name: munkaterulet
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: szakember_profil
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_szakember_profil_user
            onDelete: CASCADE
