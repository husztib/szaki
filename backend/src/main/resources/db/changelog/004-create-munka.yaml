databaseChangeLog:
  - changeSet:
      id: 004-create-munka
      author: szaki
      changes:
        - createTable:
            tableName: munka
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: megrendelo_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: cim
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: leiras
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: varos
                  type: varchar(100)
              - column:
                  name: statusz
                  type: varchar(20)
                  defaultValue: NYITOTT
                  constraints:
                    nullable: false
              - column:
                  name: hatarido
                  type: date
              - column:
                  name: letrehozva
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: munka
            baseColumnNames: megrendelo_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_munka_megrendelo
            onDelete: CASCADE
        - createTable:
            tableName: munka_szakterulet
            columns:
              - column:
                  name: munka_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: szakterulet_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: munka_szakterulet
            columnNames: munka_id, szakterulet_id
            constraintName: pk_munka_szakterulet
        - addForeignKeyConstraint:
            baseTableName: munka_szakterulet
            baseColumnNames: munka_id
            referencedTableName: munka
            referencedColumnNames: id
            constraintName: fk_munka_szakterulet_munka
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: munka_szakterulet
            baseColumnNames: szakterulet_id
            referencedTableName: szakterulet
            referencedColumnNames: id
            constraintName: fk_munka_szakterulet_szakterulet
            onDelete: CASCADE
