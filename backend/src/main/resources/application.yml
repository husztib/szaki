spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/szaki
    username: szaki
    password: szaki
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: CHANGE_ME_IN_PRODUCTION_use_a_long_random_base64_encoded_string_at_least_256_bits
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: always
