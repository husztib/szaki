services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: szaki
      POSTGRES_USER: szaki
      POSTGRES_PASSWORD: szaki
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szaki"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/szaki
      SPRING_DATASOURCE_USERNAME: szaki
      SPRING_DATASOURCE_PASSWORD: szaki
      SPRING_LIQUIBASE_CONTEXTS: dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
